  <style>
    /* Matches the app's dark background so there is no white flash while
       Flutter loads. */
    html, body {
      margin: 0;
      height: 100%;
      background: linear-gradient(135deg, #0b1633 0%, #12345a 55%, #1b5f86 100%);
      color: #fff;
      font-family: system-ui, "Segoe UI", Roboto, sans-serif;
    }
    noscript { display: block; max-width: 640px; margin: 0 auto; padding: 48px 24px; line-height: 1.6; }
    noscript a { color: #fff; }

    /* Preloader: pure HTML/CSS so it paints immediately, before any script
       or font loads. Fades out on Flutter's first frame. */
    #preloader {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: inherit;
      transition: opacity .6s ease, visibility .6s;
    }
    #preloader::after { /* same dim as the app's background overlay */
      content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.35); z-index: -1;
    }
    #preloader.done { opacity: 0; visibility: hidden; }
    .pl-ribbon { width: min(560px, 82vw); height: 90px; overflow: visible; }
    .pl-ribbon path {
      fill: none; stroke: #fff; stroke-width: 1.2; stroke-linecap: round;
      animation: pl-flow 3.2s ease-in-out infinite alternate;
      transform-origin: center;
    }
    .pl-ribbon path:nth-child(1) { opacity: .55; animation-delay: -.2s; }
    .pl-ribbon path:nth-child(2) { opacity: .3;  animation-delay: -.9s; }
    .pl-ribbon path:nth-child(3) { opacity: .45; animation-delay: -1.6s; }
    .pl-ribbon path:nth-child(4) { opacity: .2;  animation-delay: -2.3s; }
    .pl-ribbon path:nth-child(5) { opacity: .35; animation-delay: -2.9s; }
    @keyframes pl-flow {
      from { transform: translateY(-7px) scaleY(.75); }
      to   { transform: translateY(7px) scaleY(1.15); }
    }
    .pl-name {
      margin-top: 26px; font-size: 22px; font-weight: 500; letter-spacing: .06em;
      text-shadow: 0 0 18px rgba(255,255,255,.35);
    }
    .pl-status {
      margin-top: 10px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase;
      color: rgba(255,255,255,.6);
    }
    .pl-status::after { content: "…"; animation: pl-blink 1.4s steps(1) infinite; }
    @keyframes pl-blink { 50% { opacity: 0; } }
    .pl-bar {
      margin-top: 18px; width: 140px; height: 2px; border-radius: 2px; overflow: hidden;
      background: rgba(255,255,255,.15);
    }
    .pl-bar::before {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 2px;
      background: linear-gradient(90deg, transparent, #fff, transparent);
      animation: pl-sweep 1.3s ease-in-out infinite;
    }
    @keyframes pl-sweep { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) {
      .pl-ribbon path, .pl-bar::before, .pl-status::after { animation: none; }
    }
  </style>
